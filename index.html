<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1457d9" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Travel · 여행지 모음</title>
    <style>
      :root { color: #14213d; background: #f5f8fc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0; }
      .eyebrow { color: #2563eb; font-size: 12px; font-weight: 900; letter-spacing: .18em; }
      h1 { margin: 12px 0 8px; font-size: clamp(32px, 7vw, 52px); letter-spacing: -.06em; }
      .intro { margin: 0 0 32px; color: #71819a; font-size: 16px; font-weight: 650; line-height: 1.6; }
      .trip-list { display: grid; gap: 14px; }
      .trip-card { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 24px; border: 1px solid #dce5f0; border-radius: 24px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 12px 28px rgb(30 64 115 / 7%); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
      .trip-card:hover, .trip-card:focus-visible { border-color: #9bb8ed; box-shadow: 0 16px 32px rgb(30 64 115 / 12%); transform: translateY(-2px); }
      .trip-card strong { display: block; font-size: 20px; letter-spacing: -.04em; }
      .trip-card small { display: block; margin-top: 6px; color: #8090a8; font-size: 13px; font-weight: 700; }
      .arrow { color: #2563eb; font-size: 24px; font-weight: 800; }
      .footer-note { margin-top: 24px; color: #95a3b7; font-size: 12px; line-height: 1.6; }
      @media (max-width: 520px) { main { padding: 36px 0; } .trip-card { padding: 19px 18px; border-radius: 20px; } }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">TRAVEL HUB</span>
      <h1>여행지 모음</h1>
      <p class="intro">여행지별 폴더에서 일정, 지도, 예약, 메뉴와 현지 메모를 한 번에 확인하세요.</p>
      <section class="trip-list" aria-label="여행지 목록">
        <a class="trip-card" href="./kyoto-kobe-trip/" data-trip-slug="kyoto-kobe-trip">
          <span><strong>교토 · 고베</strong><small>19일 ~ 22일 · 일본</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="trip-card" href="./jeju-sports-trip/" data-trip-slug="jeju-sports-trip">
          <span><strong>제주 10월 스포츠 투어</strong><small>10월 1일 ~ 4일 · TransJeju Jeju60K</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="trip-card" href="./busan-solo-trip/" data-trip-slug="busan-solo-trip">
          <span><strong>부산 혼자 여행</strong><small>9월 28일 ~ 29일 · 센텀시티 · 광안리</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </section>
      <p class="footer-note">새 여행은 여행지 슬러그 폴더와 일정 데이터를 추가하면 이 목록에서 이어서 관리할 수 있습니다.</p>
    </main>
    <script>
      if (["localhost", "127.0.0.1", "terminal.local"].includes(window.location.hostname)) {
        const tripSlugs = [...document.querySelectorAll("[data-trip-slug]")].map((link) => link.dataset.tripSlug);
        const pathParts = window.location.pathname.split("/").filter(Boolean);
        const pathSlug = pathParts.at(-1);
        if (pathSlug && tripSlugs.includes(pathSlug) && !pathParts.includes("page")) {
          window.location.replace(`${window.location.origin}/page/${pathSlug}/${window.location.search}${window.location.hash}`);
        }
        document.querySelectorAll("[data-trip-slug]").forEach((link) => {
          link.href = `./page/${link.dataset.tripSlug}/`;
        });
      }
    </script>
  </body>
</html>
